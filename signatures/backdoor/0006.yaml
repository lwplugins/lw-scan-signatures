id: lw:0006
kind: regex
target: file_php
pattern: 'create_function\s*\(\s*[^,]*,\s*[^)]*\$_(GET|POST|REQUEST|COOKIE)'
flags: i
sql_like: null
tier: suspicious
category: backdoor
name: create_function() body sourced from request input
description: The deprecated create_function() builds an anonymous function whose body comes from $_GET/$_POST/$_REQUEST/$_COOKIE, an eval()-equivalent code execution primitive.
common_strings: []
tests:
  match:
    - "create_function('', $_GET['f']);"
    - "create_function('$a', $_POST['body']);"
  no_match:
    - "create_function('', 'return 1;');"
    - "$fn = function() use ($_GET) { return 1; };"
