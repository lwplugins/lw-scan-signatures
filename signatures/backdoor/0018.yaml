id: lw:0018
kind: regex
target: file_php
pattern: '\*\s*Original size:\s*\d+\s*bytes\s*[\r\n]+\s*\*\s*Encoded size:\s*\d+\s*chars'
flags: i
sql_like: null
tier: infected
category: backdoor
name: "\"Advanced Web Application Framework\" encoder header"
description: The generated docblock of a backdoor family that disguises itself as a MIT-licensed framework file and carries a large base64 payload. The size pair (original bytes vs encoded chars) is written by the packer and appears in no legitimate code. Seen on a real compromised site in wp-admin/css and inside two fake plugins; Wordfence CLI missed all three files.
common_strings: []
tests:
  match:
    - " * Original size: 147240 bytes\n * Encoded size: 196308 chars"
    - "* Original size:1009451 bytes\n   * Encoded size:1345924 chars"
  no_match:
    - "// Original size: 147240 bytes after minification"
    - " * Encoded size: 196308 chars"
