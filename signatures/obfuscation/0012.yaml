id: lw:0012
kind: regex
target: file_php
pattern: '(\\x[0-9a-fA-F]{2}){3,}'
flags: ''
sql_like: null
tier: infected
category: obfuscation
name: \x-hex-encoded PHP identifier
description: A run of three or more consecutive \xNN hex-escapes, the standard way malware hides function names such as eval (\x65\x76\x61\x6c) from plain-text signature scanners.
common_strings: []
tests:
  match:
    - "$f = \"\\x65\\x76\\x61\\x6c\"; $f($_POST['c']);"
    - "$s = \"\\x73\\x79\\x73\\x74\\x65\\x6d\";"
  no_match:
    - "$hex = \"\\x41\";"
    - "$color = \"#ffffff\";"
